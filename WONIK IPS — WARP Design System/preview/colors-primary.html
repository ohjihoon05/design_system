<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F0F0F2; padding: 16px; font-family: 'Segoe UI', 'Inter', sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { display: flex; flex-direction: column; width: 110px; }
  .swatch__color { height: 44px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.08); }
  .swatch__name { font-size: 9px; color: #555; margin-top: 4px; line-height: 1.3; }
  .swatch__val  { font-size: 9px; color: #999; font-family: monospace; }
</style>
</head><body>
<div class="grid">
  <div class="swatch"><div class="swatch__color" style="background:#273D7F"></div><div class="swatch__name">Primary</div><div class="swatch__val">#273D7F</div></div>
  <div class="swatch"><div class="swatch__color" style="background:#D6DCF0"></div><div class="swatch__name">Primary Tint BG</div><div class="swatch__val">#D6DCF0</div></div>
  <div class="swatch"><div class="swatch__color" style="background:#A8B4D8"></div><div class="swatch__name">Primary Stroke</div><div class="swatch__val">#A8B4D8</div></div>
  <div class="swatch"><div class="swatch__color" style="background:#EEF0F8"></div><div class="swatch__name">Primary Pale</div><div class="swatch__val">#EEF0F8</div></div>
  <div class="swatch"><div class="swatch__color" style="background:#1C2E60"></div><div class="swatch__name">Selected Border</div><div class="swatch__val">#1C2E60</div></div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F0F0F2; padding: 16px 20px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid #DDD; }
  .row:last-child { border-bottom: none; }
  .meta { font-size: 9px; color: #999; width: 90px; flex-shrink: 0; font-family: monospace; line-height: 1.4; }
  .sample { font-family: var(--font-family); line-height: 1; color: #5C5C66; }
</style>
</head><body>
  <div class="row">
    <div class="meta">8px / micro<br>sensor values</div>
    <div class="sample" style="font-size:8px">BG100T &nbsp; 0.000 &nbsp; 2500.000 &nbsp; ㅡㅡ</div>
  </div>
  <div class="row">
    <div class="meta">10px / label-sm<br>captions, tabs</div>
    <div class="sample" style="font-size:10px">SYS'INIT &nbsp; ADMIN &nbsp; Acess Mode &nbsp; Manual &nbsp; CJob Name</div>
  </div>
  <div class="row">
    <div class="meta">12px / label<br>primary labels</div>
    <div class="sample" style="font-size:12px">Load Port Information &nbsp; Ready &nbsp; Not Connected &nbsp; PMC1</div>
  </div>
  <div class="row">
    <div class="meta">14px / title-sm<br>module name</div>
    <div class="sample" style="font-size:14px; color:#5C5C66">WARP</div>
  </div>
</body></html>

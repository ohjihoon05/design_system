<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F0F0F2; padding: 16px 20px; }
  .row { display: flex; align-items: center; gap: 20px; padding: 8px 12px; border-radius: 6px; margin-bottom: 4px; background: #FEFEFE; border: 1px solid #E1E1E4; }
  .tag { font-size: 8px; color: #999; width: 80px; flex-shrink: 0; }
</style>
</head><body>

  <div class="row" style="background:#1E1E21; border-color:#52525C">
    <div class="tag" style="color:#666">module name</div>
    <span style="font-size:14px;color:#5C5C66;line-height:1;font-family:var(--font-family)">WARP</span>
    <span style="font-size:10px;color:#2B7FFF;line-height:1;margin-left:4px;font-family:var(--font-family)">● ADMIN</span>
  </div>

  <div class="row">
    <div class="tag">dot + label</div>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#D9D9DC;font-family:var(--font-family)">
      <span style="width:5px;height:5px;border-radius:50%;background:#2B7FFF;display:inline-block"></span>PMC1
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#00D492;font-family:var(--font-family)">
      <span style="width:4px;height:4px;border-radius:50%;background:#07895E;display:inline-block"></span>Ready
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#D09804;font-family:var(--font-family)">
      <span style="width:4px;height:4px;border-radius:50%;background:#FE9A00;display:inline-block"></span>Manual
    </span>
  </div>

  <div class="row" style="background:#1E1E21; border-color:#52525C">
    <div class="tag" style="color:#666">macro value</div>
    <span style="font-size:12px;color:#E0E0E3;line-height:1;font-family:var(--font-family)">Not Connected</span>
    <span style="font-size:10px;color:#E0E0E3;line-height:1;font-family:var(--font-family)">MACRO &nbsp; ㅡㅡ &nbsp; STEP &nbsp; 0 / 0</span>
  </div>

  <div class="row">
    <div class="tag">table label</div>
    <span style="font-size:10px;color:#71717B;line-height:1;font-family:var(--font-family)">Recipe Name</span>
    <span style="font-size:10px;color:#71717B;line-height:1;font-family:var(--font-family)">Carrier ID</span>
    <span style="font-size:10px;color:#71717B;line-height:1;font-family:var(--font-family)">0.00 / 0.00</span>
  </div>

  <div class="row" style="background:#E7E7E7; border-color:#D4D4D8">
    <div class="tag">sensor micro</div>
    <span style="font-size:8px;color:#5C5C66;line-height:1;font-family:var(--font-family)">BG100T</span>
    <span style="font-size:8px;color:#5C5C66;line-height:1;font-family:var(--font-family)">2500.000</span>
    <span style="font-size:8px;color:#5C5C66;line-height:1;font-family:var(--font-family)">0.100</span>
  </div>

</body></html>

# 의존성 업데이트 알림. 주 1회, 작은 업데이트는 PR 하나로 묶어요.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/atlas"
      - "/apps/demo-fab-monitor"
      - "/apps/demo-tracker"
      - "/apps/singlefile-spike"
      - "/apps/storybook"
      - "/apps/web-sandbox"
      - "/packages/tokens"
      - "/packages/web"
      - "/tools/registry-rehearsal/consumer-smoke"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
